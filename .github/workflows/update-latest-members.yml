name: Update latest member total

# dashboard.nsf.or.th blocks GitHub-hosted runners.
# Run this manually after attaching a self-hosted runner inside a network
# that can reach the official NSF dashboard.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-member-total
  cancel-in-progress: true

jobs:
  update:
    runs-on: [self-hosted, nsf-network]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read the official dashboard and update the snapshot
        run: node scripts/update-latest-members.mjs
      - name: Commit a changed total
        shell: bash
        run: |
          if git diff --quiet -- data/2569.js; then
            echo "No published change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/2569.js
          git commit -m "อัปเดตยอดสมาชิกล่าสุดอัตโนมัติ"
          git push
