name: Check Tableau connection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-tableau-connection
  cancel-in-progress: true

jobs:
  check:
    name: Verify PAT and aggregate-data access
    runs-on: [self-hosted, nsf-network]
    timeout-minutes: 5
    env:
      TABLEAU_SERVER_URL: https://nsfwnbi.nsf.or.th
      TABLEAU_SITE_CONTENT_URL: nsf
      TABLEAU_REST_API_VERSION: "3.27"
      TABLEAU_DATASOURCE_LUID: 08ae6a5c-4b0d-418f-8881-95a11ed5ab28
      # Trust certificates approved in the macOS System Keychain. Do not use
      # NODE_TLS_REJECT_UNAUTHORIZED=0 because TLS verification must stay on.
      NODE_USE_SYSTEM_CA: "1"
      TABLEAU_PAT_NAME: ${{ secrets.TABLEAU_PAT_NAME }}
      TABLEAU_PAT_SECRET: ${{ secrets.TABLEAU_PAT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify Tableau connection without reading person-level rows
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/digicert-global-g2-tls-rsa-sha256-2020-ca1.pem
        run: node scripts/check-tableau-connection.mjs
